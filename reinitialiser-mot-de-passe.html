<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe | Les Hortensias</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest?v=2" />
</head>
<body class="app-body">
  <div class="app-container narrow">
    <div class="app-card app-login-card">
      <div class="app-logo"><span><img class="logo-hortensia" src="/favicon.svg?v=2" alt="" aria-hidden="true" /></span><span>Les Hortensias</span></div>
      <h2 style="text-align:center;" id="pageTitle">Choisir un nouveau mot de passe</h2>
      <div id="msgBox"></div>
      <form id="pwdForm">
        <div class="app-field">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" required minlength="10" autocomplete="new-password" />
          <p class="app-field-hint">10 caractères minimum, avec au moins une lettre et un chiffre.</p>
        </div>
        <div class="app-field">
          <label for="password2">Confirmer le mot de passe</label>
          <input type="password" id="password2" required minlength="10" autocomplete="new-password" />
        </div>
        <button type="submit" class="app-btn" style="width:100%;" id="submitBtn">Valider</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { getSupabaseClient } from './lib/supabaseClient.js';

    const msgBox = document.getElementById('msgBox');
    const form = document.getElementById('pwdForm');
    const submitBtn = document.getElementById('submitBtn');

    function showMsg(text, type = 'error') {
      msgBox.innerHTML = `<div class="app-msg app-msg-${type}">${text}</div>`;
    }

    // Établit la session à partir du lien reçu par e-mail (token_hash + type),
    // envoyé par nos propres fonctions serveur (api/admin/create-teacher.js,
    // api/public/forgot-password.js) — indépendant de la configuration des URLs
    // de redirection Supabase.
    // Lien d'accès à l'espace client envoyé par l'équipe (?invitation=<jeton>) :
    // échangé côté serveur contre un code à usage unique (le jeton lui-même
    // reste valable jusqu'à la définition du mot de passe ou son expiration).
    async function establishSessionFromInvitation(token) {
      form.style.display = 'none';
      showMsg('Vérification du lien…', 'info');
      const MESSAGES = {
        expired: 'Ce lien d\'activation a expiré. Merci de contacter l\'équipe du Centre Les Hortensias (06 92 36 58 38 — contact.funloisirsreunion@gmail.com) pour recevoir un nouveau lien.',
        replaced: 'Ce lien a été remplacé par un lien plus récent. Merci d\'utiliser le dernier e-mail reçu du Centre Les Hortensias.',
        already_active: 'Votre espace client est déjà activé. <a href="espace-client/" style="color:var(--vert-fonce);font-weight:700;">Connectez-vous avec votre adresse e-mail et votre mot de passe</a> (lien « Mot de passe oublié ? » si besoin).',
        invalid: 'Ce lien est invalide. Vérifiez que vous avez bien copié l\'adresse complète reçue par e-mail.',
        error: 'Le lien n\'a pas pu être vérifié pour le moment. Merci de réessayer dans quelques instants.',
      };
      try {
        const res = await fetch('/api/public/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'invitation', token }),
        });
        const json = await res.json().catch(() => ({}));
        if (json.status !== 'ok') { showMsg(MESSAGES[json.status] || MESSAGES.error, json.status === 'already_active' ? 'info' : 'error'); return false; }
        const supabase = await getSupabaseClient();
        await supabase.auth.signOut().catch(() => {});
        const { error } = await supabase.auth.verifyOtp({ token_hash: json.token_hash, type: 'recovery' });
        if (error) throw error;
        window.history.replaceState({}, '', window.location.pathname);
        document.title = 'Activer mon espace client | Les Hortensias';
        document.getElementById('pageTitle').textContent = json.kind === 'activation' ? 'Activer votre espace client' : 'Choisir un nouveau mot de passe';
        showMsg(`Identifiant : <strong>${String(json.email).replace(/[&<>"']/g, '')}</strong><br/>Choisissez votre mot de passe personnel pour accéder à votre dossier de séjour.`, 'info');
        form.style.display = '';
        return true;
      } catch (error) {
        showMsg(MESSAGES.error);
        return false;
      }
    }

    async function establishSessionFromLink() {
      const params = new URLSearchParams(window.location.search);
      const invitation = params.get('invitation');
      if (invitation) return establishSessionFromInvitation(invitation);
      const tokenHash = params.get('token_hash');
      const type = params.get('type');
      if (!tokenHash || !type) return true; // pas de lien à vérifier, on continue normalement

      form.style.display = 'none';
      showMsg('Vérification du lien…', 'info');
      try {
        const supabase = await getSupabaseClient();
        const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type });
        if (error) throw error;
        // Nettoie l'URL (le token ne doit pas rester visible/partageable).
        window.history.replaceState({}, '', window.location.pathname);
        msgBox.innerHTML = '';
        form.style.display = '';
        return true;
      } catch (error) {
        showMsg('Ce lien est invalide ou a expiré. Merci de refaire une demande depuis la page de connexion.');
        return false;
      }
    }

    establishSessionFromLink();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1 !== p2) { showMsg('Les deux mots de passe ne correspondent pas.'); return; }
      if (p1.length < 10 || !/[A-Za-z]/.test(p1) || !/[0-9]/.test(p1)) {
        showMsg('Le mot de passe doit contenir au moins 10 caractères, dont au moins une lettre et un chiffre.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enregistrement…';
      try {
        const supabase = await getSupabaseClient();
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          showMsg('Lien invalide ou expiré. Merci de refaire une demande de réinitialisation depuis la page de connexion.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Valider';
          return;
        }
        const { error } = await supabase.auth.updateUser({ password: p1 });
        if (error) throw error;

        const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();

        // Marque l'accès (invitation) comme activé — déclenche le journal + la notification admin.
        // Policy RLS dédiée : n'autorise que la transition invitation_envoyee -> compte_active, sur son propre compte.
        if (profile && profile.role === 'client') {
          await supabase.from('dossier_acces')
            .update({ statut: 'compte_active', activated_at: new Date().toISOString() })
            .eq('profile_id', session.user.id)
            .eq('statut', 'invitation_envoyee');
        }

        showMsg('Mot de passe mis à jour. Redirection…', 'success');
        setTimeout(() => {
          window.location.href = (profile && profile.role === 'admin') ? 'admin/dashboard.html' : 'espace-client/dashboard.html';
        }, 1200);
      } catch (error) {
        showMsg(error.message || 'Échec de la mise à jour du mot de passe.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Valider';
      }
    });
  </script>
</body>
</html>
