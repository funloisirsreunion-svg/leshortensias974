<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier — Administration | Les Hortensias</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body class="app-body">
  <div class="app-topbar">
    <div class="app-logo"><span>🌸</span><span>Administration — Les Hortensias</span></div>
    <div class="app-user">
      <a href="dashboard.html" class="app-btn app-btn-sm app-btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);">← Tableau de bord</a>
      <a href="parametres.html" class="app-btn app-btn-sm app-btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);">⚙️</a>
      <button class="app-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="app-container" id="appRoot">
    <div class="app-loading">Chargement du dossier…</div>
  </div>

  <script type="module">
    import { getSupabaseClient } from '../lib/supabaseClient.js';
    import { STATUTS, DOC_STATUTS, REGIMES, NIVEAUX, JOURNAL_LABELS, ACCESS_STATUTS, CLIENT_TYPES, STRUCTURE_TYPES, FORMULES, ALL_DOCUMENT_TYPES, DOCUMENT_SOURCES, labelForDocumentType, labelOf, formatDateFr, formatMontant, docCompleteness, computeClassEstimate } from '../lib/appConstants.js';

    const params = new URLSearchParams(window.location.search);
    const dossierId = params.get('id');
    const root = document.getElementById('appRoot');
    let supabase, session, dossier, regimes, documents, paiements, signalements, historique, journal, acces;
    let showNonRequis = false;
    let deletePanelOpen = false;

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function opt(list, val, key='value', lab='label') {
      return list.map(o => `<option value="${o[key]}" ${o[key]===val?'selected':''}>${o[lab]}</option>`).join('');
    }

    // Lit les valeurs actuelles des champs programme/durée/effectifs directement dans
    // le DOM (répartis entre generalForm et effectifsForm) — permet un recalcul en
    // temps réel avant même l'enregistrement.
    function readCurrentSchoolInputs() {
      const val = (name) => document.querySelector(`[name="${name}"]`)?.value;
      return {
        programme: val('programme') || null,
        duree: val('duree') ? Number(val('duree')) : null,
        nbEleves: val('effectif_prev_eleves') ? Number(val('effectif_prev_eleves')) : null,
        nbProfs: val('effectif_prev_profs') ? Number(val('effectif_prev_profs')) : null,
        nbAccompagnateurs: val('effectif_prev_accompagnateurs') ? Number(val('effectif_prev_accompagnateurs')) : null,
      };
    }

    function currentClassEstimate() {
      return computeClassEstimate(readCurrentSchoolInputs());
    }

    function renderEstimation() {
      const box = document.getElementById('estimationContent');
      if (!box) return;
      const est = currentClassEstimate();
      if (!est) {
        box.innerHTML = `<p style="color:var(--texte-clair);">Renseignez le programme, la durée et le nombre d'élèves pour voir apparaître une estimation.</p>`;
        return;
      }
      const progLabel = est.programme === 'volcan' ? 'Classe Volcan' : 'Classe Nature';
      box.innerHTML = `
        <div class="app-grid-3" style="margin-bottom:10px;row-gap:6px;">
          <div><strong>Programme :</strong> ${esc(progLabel)}</div>
          <div><strong>Durée :</strong> ${est.duree} jours</div>
          <div><strong>Élèves :</strong> ${est.nbEleves}</div>
          <div><strong>Professeurs :</strong> ${est.nbProfs}</div>
          <div><strong>Accompagnateurs :</strong> ${est.nbAccompagnateurs}</div>
        </div>
        <p style="font-size:1.3rem;font-weight:700;color:var(--vert-fonce);margin:10px 0;">Montant prévisionnel : ${formatMontant(est.total)} TTC</p>
        <details>
          <summary style="cursor:pointer;color:var(--vert-fonce);font-weight:600;">Voir le détail</summary>
          <div class="app-table-wrap" style="margin-top:10px;">
          <table class="app-table" style="max-width:480px;min-width:0;">
            <tbody>
              <tr><td>${est.nbEleves} élèves × ${formatMontant(est.tarifEleve)}</td><td style="text-align:right;">${formatMontant(est.montantEleves)}</td></tr>
              <tr><td>${est.nbProfs} professeurs × ${formatMontant(est.tarifProf)}</td><td style="text-align:right;">${formatMontant(est.montantProfs)}</td></tr>
              <tr><td>${est.nbAccompagnateurs} accompagnateurs × ${formatMontant(est.tarifAccompagnateur)}</td><td style="text-align:right;">${formatMontant(est.montantAccompagnateurs)}</td></tr>
              <tr style="font-weight:700;border-top:2px solid var(--beige-fonce);"><td>Estimation totale</td><td style="text-align:right;">${formatMontant(est.total)}</td></tr>
            </tbody>
          </table>
          </div>
        </details>`;
    }

    function attachEstimationListeners() {
      if (dossier.client_type !== 'school') return;
      renderEstimation();
      ['programme', 'duree', 'effectif_prev_eleves', 'effectif_prev_profs', 'effectif_prev_accompagnateurs'].forEach((name) => {
        const el = document.querySelector(`[name="${name}"]`);
        if (!el) return;
        el.addEventListener('input', renderEstimation);
        el.addEventListener('change', renderEstimation);
      });
    }

    async function init() {
      if (!dossierId) { root.innerHTML = `<div class="app-msg app-msg-error">Dossier non spécifié.</div>`; return; }
      try { supabase = await getSupabaseClient(); }
      catch (e) { root.innerHTML = `<div class="app-msg app-msg-error">${esc(e.message)}</div>`; return; }

      const { data: { session: s } } = await supabase.auth.getSession();
      if (!s) { window.location.href = 'index.html'; return; }
      session = s;

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
      if (!profile || profile.role !== 'admin') { await supabase.auth.signOut(); window.location.href = 'index.html'; return; }

      await loadAll();
    }

    async function loadAll() {
      const [{ data: d, error: dErr }, { data: r }, { data: docs }, { data: pmts }, { data: sig }, { data: hist }, { data: journ }, { data: accesRows }] = await Promise.all([
        supabase.from('dossiers').select('*').eq('id', dossierId).single(),
        supabase.from('regimes_alimentaires').select('*').eq('dossier_id', dossierId).order('type'),
        supabase.from('documents').select('*').eq('dossier_id', dossierId),
        supabase.from('paiements').select('*').eq('dossier_id', dossierId).order('date_paiement', { ascending: false }),
        supabase.from('signalements_paiement').select('*').eq('dossier_id', dossierId).order('created_at', { ascending: false }),
        supabase.from('statuts_historique').select('*').eq('dossier_id', dossierId).order('changed_at', { ascending: false }),
        supabase.from('dossier_journal').select('*').eq('dossier_id', dossierId).order('created_at', { ascending: false }),
        supabase.from('dossier_acces').select('*, profiles(*)').eq('dossier_id', dossierId).order('created_at'),
      ]);
      if (dErr || !d) { root.innerHTML = `<div class="app-msg app-msg-error">Dossier introuvable.</div>`; return; }
      dossier = d; regimes = r || []; documents = docs || []; paiements = pmts || []; signalements = sig || [];
      historique = hist || []; journal = journ || []; acces = accesRows || [];
      render();
    }

    function buildTimeline() {
      const fromHistorique = historique.map(h => ({
        ts: h.changed_at,
        label: (h.ancien_statut ? labelOf(STATUTS, h.ancien_statut) + ' → ' : '') + labelOf(STATUTS, h.nouveau_statut),
        details: null,
      }));
      const fromJournal = journal.map(j => ({
        ts: j.created_at,
        label: JOURNAL_LABELS[j.action] || j.action,
        details: j.details,
      }));
      return [...fromHistorique, ...fromJournal]
        .sort((a, b) => new Date(b.ts) - new Date(a.ts))
        .map(item => ({ ...item, date: new Date(item.ts).toLocaleString('fr-FR') }));
    }

    function buildQuickActions() {
      const s = dossier.statut;
      const actions = [];
      if (s === 'demande_recue') {
        actions.push({ id: 'valider', label: 'Valider la demande', cls: '' });
        actions.push({ id: 'refuser', label: 'Refuser', cls: 'app-btn-outline' });
      } else if (!['refusee', 'annule', 'cloture'].includes(s)) {
        if (s === 'demande_validee' && dossier.montant_devis) {
          actions.push({ id: 'devis_envoye', label: 'Marquer le devis envoyé', cls: '' });
        }
        actions.push({ id: 'relance', label: 'Envoyer une relance', cls: 'app-btn-outline' });
      }
      return actions;
    }

    function renderGeneralFields() {
      const ct = dossier.client_type;
      const commonStatutDates = `
            <div class="app-grid-3">
              <div class="app-field"><label>Statut</label><select name="statut">${opt(STATUTS, dossier.statut)}</select></div>
              <div class="app-field"><label>Date proposée</label><input type="date" name="date_proposee" value="${dossier.date_proposee||''}" /></div>
              <div class="app-field"><label>Date confirmée — arrivée</label><input type="date" name="date_confirmee_debut" value="${dossier.date_confirmee_debut||''}" /></div>
            </div>
            <div class="app-field" style="max-width:240px;"><label>Date confirmée — départ</label><input type="date" name="date_confirmee_fin" value="${dossier.date_confirmee_fin||''}" /></div>`;

      if (ct === 'group') {
        return `
            <div class="app-grid-2">
              <div class="app-field"><label>Nom de la structure</label><input type="text" name="structure_nom" value="${esc(dossier.structure_nom)}" required /></div>
              <div class="app-field"><label>Type de structure</label><select name="structure_type"><option value="">—</option>${opt(STRUCTURE_TYPES, dossier.structure_type)}</select></div>
            </div>
            <div class="app-grid-3">
              <div class="app-field"><label>Contact (nom)</label><input type="text" name="contact_nom" value="${esc(dossier.contact_nom)}" /></div>
              <div class="app-field"><label>Contact (prénom)</label><input type="text" name="contact_prenom" value="${esc(dossier.contact_prenom)}" /></div>
              <div class="app-field"><label>Fonction</label><input type="text" name="contact_fonction" value="${esc(dossier.contact_fonction)}" /></div>
            </div>
            <div class="app-grid-2">
              <div class="app-field"><label>Téléphone</label><input type="text" name="contact_telephone" value="${esc(dossier.contact_telephone)}" /></div>
              <div class="app-field"><label>E-mail</label><input type="email" name="contact_email" value="${esc(dossier.contact_email)}" /></div>
            </div>
            <h3>Demande initiale (indicative — ne confirme jamais une réservation)</h3>
            <div class="app-grid-2">
              <div class="app-field"><label>Date d'arrivée demandée</label><input type="date" name="demande_date_arrivee" value="${dossier.demande_date_arrivee||''}" /></div>
              <div class="app-field"><label>Heure d'arrivée</label><input type="time" name="demande_heure_arrivee" value="${esc(dossier.demande_heure_arrivee)}" /></div>
            </div>
            <div class="app-grid-2">
              <div class="app-field"><label>Date de départ demandée</label><input type="date" name="demande_date_depart" value="${dossier.demande_date_depart||''}" /></div>
              <div class="app-field"><label>Heure de départ</label><input type="time" name="demande_heure_depart" value="${esc(dossier.demande_heure_depart)}" /></div>
            </div>
            <div class="app-field"><label>Formule</label><select name="formule"><option value="">—</option>${opt(FORMULES, dossier.formule)}</select></div>
            <h3>Dates et statut confirmés par Fun Loisirs</h3>
            ${commonStatutDates}`;
      }

      if (ct === 'colony') {
        return `
            <div class="app-grid-2">
              <div class="app-field"><label>Prénom de l'enfant</label><input type="text" name="enfant_prenom" value="${esc(dossier.enfant_prenom)}" required /></div>
              <div class="app-field"><label>Nom de l'enfant</label><input type="text" name="enfant_nom" value="${esc(dossier.enfant_nom)}" required /></div>
            </div>
            <div class="app-grid-2">
              <div class="app-field"><label>Date de naissance</label><input type="date" name="enfant_date_naissance" value="${dossier.enfant_date_naissance||''}" /></div>
              <div class="app-field"><label>Sexe</label><select name="enfant_sexe"><option value="">—</option><option value="fille" ${dossier.enfant_sexe==='fille'?'selected':''}>Fille</option><option value="garcon" ${dossier.enfant_sexe==='garcon'?'selected':''}>Garçon</option></select></div>
            </div>
            <div class="app-field"><label>Colonie concernée</label><input type="text" name="colonie_nom" value="${esc(dossier.colonie_nom)}" /></div>
            <div class="app-grid-2">
              <div class="app-field"><label>Responsable légal (nom)</label><input type="text" name="contact_nom" value="${esc(dossier.contact_nom)}" /></div>
              <div class="app-field"><label>Téléphone</label><input type="text" name="contact_telephone" value="${esc(dossier.contact_telephone)}" /></div>
            </div>
            <div class="app-field"><label>E-mail</label><input type="email" name="contact_email" value="${esc(dossier.contact_email)}" /></div>
            <div class="app-grid-3">
              <div class="app-field"><label>Bénéficiaire CAF/VACAF</label><select name="beneficiaire_vacaf"><option value="">—</option><option value="true" ${dossier.beneficiaire_vacaf===true?'selected':''}>Oui</option><option value="false" ${dossier.beneficiaire_vacaf===false?'selected':''}>Non</option></select></div>
              <div class="app-field"><label>N° allocataire</label><input type="text" name="numero_allocataire" value="${esc(dossier.numero_allocataire)}" /></div>
              <div class="app-field"><label>Tarif colonie (€)</label><input type="number" step="0.01" name="tarif_colonie" value="${dossier.tarif_colonie ?? ''}" /></div>
            </div>
            <div class="app-grid-2">
              <div class="app-field"><label>Autorisation partage privé (familles)</label><select name="autorisation_partage_prive"><option value="">—</option><option value="true" ${dossier.autorisation_partage_prive===true?'selected':''}>Oui</option><option value="false" ${dossier.autorisation_partage_prive===false?'selected':''}>Non</option></select></div>
              <div class="app-field"><label>Autorisation communication publique</label><select name="autorisation_communication_publique"><option value="">—</option><option value="true" ${dossier.autorisation_communication_publique===true?'selected':''}>Oui</option><option value="false" ${dossier.autorisation_communication_publique===false?'selected':''}>Non</option></select></div>
            </div>
            <h3>Statut du dossier</h3>
            <div class="app-field"><label>Statut</label><select name="statut">${opt(STATUTS, dossier.statut)}</select></div>`;
      }

      // school (par défaut)
      return `
            <div class="app-grid-3">
              <div class="app-field"><label>Établissement</label><input type="text" name="etablissement" value="${esc(dossier.etablissement)}" required /></div>
              <div class="app-field"><label>Commune</label><input type="text" name="commune" value="${esc(dossier.commune)}" /></div>
              <div class="app-field"><label>Code postal</label><input type="text" name="code_postal" value="${esc(dossier.code_postal)}" inputmode="numeric" maxlength="10" /></div>
            </div>
            <div class="app-field"><label>Adresse</label><input type="text" name="adresse" value="${esc(dossier.adresse)}" /></div>
            <div class="app-grid-3">
              <div class="app-field"><label>Contact</label><input type="text" name="contact_nom" value="${esc(dossier.contact_nom)}" /></div>
              <div class="app-field"><label>Téléphone</label><input type="text" name="contact_telephone" value="${esc(dossier.contact_telephone)}" /></div>
              <div class="app-field"><label>E-mail</label><input type="email" name="contact_email" value="${esc(dossier.contact_email)}" /></div>
            </div>
            <div class="app-grid-3">
              <div class="app-field"><label>Programme</label><select name="programme"><option value="">—</option>${opt([{value:'nature',label:'Nature'},{value:'volcan',label:'Volcan'}], dossier.programme)}</select></div>
              <div class="app-field"><label>Durée</label><select name="duree"><option value="">—</option>${opt([{value:'3',label:'3 jours'},{value:'4',label:'4 jours'},{value:'5',label:'5 jours'}], String(dossier.duree||''))}</select></div>
              <div class="app-field"><label>Statut</label><select name="statut">${opt(STATUTS, dossier.statut)}</select></div>
            </div>
            <div class="app-field"><label>Période souhaitée (client)</label><input type="text" name="periode_souhaitee" value="${esc(dossier.periode_souhaitee)}" readonly style="background:var(--gris-clair);" /></div>
            <div class="app-grid-3">
              <div class="app-field"><label>Date proposée</label><input type="date" name="date_proposee" value="${dossier.date_proposee||''}" /></div>
              <div class="app-field"><label>Date confirmée — arrivée</label><input type="date" name="date_confirmee_debut" value="${dossier.date_confirmee_debut||''}" /></div>
              <div class="app-field"><label>Date confirmée — départ</label><input type="date" name="date_confirmee_fin" value="${dossier.date_confirmee_fin||''}" /></div>
            </div>`;
    }

    function renderDocRow(doc) {
      const sourceInfo = DOCUMENT_SOURCES.find(s => s.value === doc.document_source) || {};
      return `
        <div class="app-doc-row" data-doc-type="${doc.type}">
          <span class="app-doc-name">
            ${esc(labelForDocumentType(doc.type))}
            <span style="font-size:.72rem;color:var(--texte-clair);font-weight:400;"> · ${esc(sourceInfo.label || doc.document_source)}${doc.client_visible ? '' : ' · 🔒 interne'}</span>
            ${doc.commentaire ? `<br/><span style="font-size:.78rem;color:var(--texte-clair);font-weight:400;">${esc(doc.commentaire)}</span>` : ''}
            ${doc.statut === 'refuse' && doc.refus_motif ? `<br/><span style="font-size:.78rem;color:#c0392b;font-weight:400;">Motif : ${esc(doc.refus_motif)}</span>` : ''}
          </span>
          ${doc.file_name ? `<a href="#" data-download="${doc.storage_path}" style="font-size:.82rem;color:var(--vert-fonce);">${esc(doc.file_name)}</a>` : '<span style="font-size:.8rem;color:var(--texte-clair);">Aucun fichier</span>'}
          <label class="app-btn app-btn-sm app-btn-outline" style="cursor:pointer;">
            ${doc.file_name ? 'Remplacer' : 'Déposer'}
            <input type="file" data-doc-upload="${doc.type}" style="display:none;" />
          </label>
          <select data-doc-statut="${doc.type}" data-doc-source="${doc.document_source}" style="padding:6px 10px;border-radius:6px;border:1px solid var(--beige-fonce);">${opt(DOC_STATUTS, doc.statut)}</select>
          <select data-doc-visible="${doc.type}" style="padding:6px 10px;border-radius:6px;border:1px solid var(--beige-fonce);">
            <option value="true" ${doc.client_visible ? 'selected' : ''}>Visible client</option>
            <option value="false" ${!doc.client_visible ? 'selected' : ''}>Interne</option>
          </select>
          <button class="app-btn app-btn-sm app-btn-danger" data-doc-delete="${doc.type}" title="Supprimer cette ligne">✕</button>
        </div>`;
    }

    function render() {
      const reste = dossier.montant_facture != null ? Number(dossier.montant_facture) - Number(dossier.montant_paye || 0) : null;
      const quickActions = buildQuickActions();
      const typeInfo = CLIENT_TYPES.find(t => t.value === dossier.client_type) || CLIENT_TYPES[0];

      root.innerHTML = `
        <div class="app-card">
          <h2>${esc(dossier.etablissement)} — <span style="color:var(--or);">${esc(dossier.numero)}</span> <span class="app-badge app-badge-gray">${typeInfo.badge} ${typeInfo.label}</span> ${dossier.source === 'public' ? '<span class="app-badge app-badge-orange">Demande site public</span>' : ''} ${dossier.archived_at ? '<span class="app-badge app-badge-gray">📦 Archivé</span>' : ''}</h2>
          <div id="msgActions"></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
            ${quickActions.map(a => `<button class="app-btn app-btn-sm ${a.cls}" data-quick-action="${a.id}">${a.label}</button>`).join('')}
            ${dossier.archived_at
              ? `<button class="app-btn app-btn-sm app-btn-outline" data-archive-toggle="restore">Restaurer</button>`
              : `<button class="app-btn app-btn-sm app-btn-outline" data-archive-toggle="archive">Archiver le dossier</button>`}
            <button class="app-btn app-btn-sm app-btn-danger" id="openDeleteBtn">Supprimer définitivement</button>
          </div>
          <div id="relancePanel" style="display:none;margin-bottom:18px;">
            <textarea id="relanceMessage" rows="3" placeholder="Message de relance (optionnel)" style="width:100%;padding:10px;border:2px solid var(--beige-fonce);border-radius:8px;font-family:inherit;"></textarea>
            <button class="app-btn app-btn-sm" id="sendRelanceBtn" style="margin-top:8px;">Envoyer</button>
          </div>
          ${deletePanelOpen ? `
          <div class="app-msg app-msg-error" style="margin-bottom:18px;">
            <strong>Attention : cette action supprimera définitivement le dossier et toutes les données associées</strong> (documents, paiements, historique, notifications, accès client). Cette action est irréversible.
            <div style="margin-top:12px;">
              <label style="display:block;margin-bottom:6px;font-weight:700;">Tapez SUPPRIMER pour confirmer :</label>
              <input type="text" id="deleteConfirmInput" style="padding:8px 12px;border:2px solid #c0392b;border-radius:6px;max-width:220px;" autocomplete="off" />
              <button class="app-btn app-btn-sm app-btn-danger" id="confirmDeleteBtn" disabled style="margin-left:8px;">Supprimer définitivement</button>
              <button class="app-btn app-btn-sm app-btn-outline" id="cancelDeleteBtn" style="margin-left:8px;">Annuler</button>
            </div>
          </div>` : ''}
          <div id="msgGeneral"></div>
          <form id="generalForm">
            ${renderGeneralFields()}
            <button type="submit" class="app-btn" style="margin-top:12px;">Enregistrer</button>
          </form>
        </div>

        ${dossier.client_type === 'school' ? `
        <div class="app-card" id="estimationCard">
          <h2>💶 Estimation du devis</h2>
          <div id="estimationContent"></div>
          <p style="margin-top:10px;font-size:.85rem;color:var(--texte-clair);font-style:italic;">Estimation indicative calculée sur les effectifs prévisionnels. Le montant définitif pourra évoluer selon les effectifs et prestations réellement retenus.</p>
        </div>` : ''}

        <div class="app-card">
          <h2>Partie financière</h2>
          <div id="msgFinance"></div>
          <form id="financeForm">
            <div class="app-grid-3">
              <div class="app-field"><label>Montant devis (€)</label><input type="number" step="0.01" name="montant_devis" value="${dossier.montant_devis ?? ''}" /></div>
              <div class="app-field"><label>Acompte attendu (€)</label><input type="number" step="0.01" name="acompte_attendu" value="${dossier.acompte_attendu ?? ''}" /></div>
              <div class="app-field"><label>Acompte reçu (€)</label><input type="number" step="0.01" name="acompte_recu" value="${dossier.acompte_recu ?? ''}" /></div>
            </div>
            <div class="app-grid-3">
              <div class="app-field"><label>Date acompte</label><input type="date" name="date_acompte" value="${dossier.date_acompte||''}" /></div>
              ${dossier.client_type === 'school' ? `
              <div class="app-field"><label>Part mairie prévue (€)</label><input type="number" step="0.01" name="part_mairie_prevue" value="${dossier.part_mairie_prevue ?? ''}" /></div>
              <div class="app-field"><label>Part mairie reçue (€)</label><input type="number" step="0.01" name="part_mairie_recue" value="${dossier.part_mairie_recue ?? ''}" /></div>` : ''}
            </div>
            ${dossier.client_type === 'group' ? `<div class="app-field" style="max-width:240px;"><label>Estimation indicative (€)</label><input type="number" step="0.01" name="estimation_montant" value="${dossier.estimation_montant ?? ''}" /></div>` : ''}
            <div class="app-field" style="max-width:240px;"><label>Montant facturé (€)</label><input type="number" step="0.01" name="montant_facture" value="${dossier.montant_facture ?? ''}" /></div>
            <button type="submit" class="app-btn">Enregistrer</button>
          </form>
          <div class="app-grid-3" style="margin-top:18px;">
            <div class="app-kpi"><div class="app-kpi-num">${formatMontant(dossier.montant_paye)}</div><div class="app-kpi-label">Total payé (calculé)</div></div>
            <div class="app-kpi"><div class="app-kpi-num">${reste != null ? formatMontant(reste) : '—'}</div><div class="app-kpi-label">Reste à payer</div></div>
            <div class="app-kpi"><div class="app-kpi-num">${paiements.length}</div><div class="app-kpi-label">Paiement(s) enregistré(s)</div></div>
          </div>

          <h3>Paiements</h3>
          <div id="msgPaiement"></div>
          <div class="app-table-wrap"><table class="app-table" style="min-width:0;">
            <thead><tr><th>Date</th><th>Type</th><th>Montant</th><th>Note</th></tr></thead>
            <tbody>${paiements.map(p => `<tr><td>${formatDateFr(p.date_paiement)}</td><td>${esc(p.type)}</td><td>${formatMontant(p.montant)}</td><td>${esc(p.note||'')}</td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;padding:14px;">Aucun paiement enregistré.</td></tr>'}</tbody>
          </table></div>
          <form id="paiementForm" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
            <div class="app-field" style="margin:0;"><label>Montant (€)</label><input type="number" step="0.01" name="montant" required style="width:120px;" /></div>
            <div class="app-field" style="margin:0;"><label>Type</label>
              <select name="type"><option value="acompte">Acompte</option><option value="part_mairie">Part mairie</option><option value="solde">Solde</option><option value="autre">Autre</option></select>
            </div>
            <div class="app-field" style="margin:0;"><label>Date</label><input type="date" name="date_paiement" value="${today()}" /></div>
            <div class="app-field" style="margin:0;flex:1;min-width:160px;"><label>Note</label><input type="text" name="note" /></div>
            <button type="submit" class="app-btn app-btn-sm">Ajouter</button>
          </form>

          ${signalements.filter(s => s.statut === 'a_verifier').length ? `
          <h3>Virements signalés par l'école (à vérifier)</h3>
          <div id="msgSignalement"></div>
          ${signalements.filter(s => s.statut === 'a_verifier').map(s => `
            <div class="app-doc-row">
              <span class="app-doc-name">${formatMontant(s.montant)} — ${formatDateFr(s.date_virement)} ${s.note ? '— ' + esc(s.note) : ''}</span>
              <button class="app-btn app-btn-sm" data-rapprocher="${s.id}" data-montant="${s.montant}" data-date="${s.date_virement}">Enregistrer comme paiement</button>
              <button class="app-btn app-btn-sm app-btn-outline" data-ignorer="${s.id}">Ignorer</button>
            </div>
          `).join('')}` : ''}
        </div>

        <div class="app-card">
          <h2>Documents</h2>
          ${(() => { const c = docCompleteness(documents); return c.total ? `<p style="color:var(--texte-clair);font-size:.88rem;margin-bottom:14px;">${c.complete ? '✅' : '⚠️'} ${c.valides}/${c.total} documents requis validés${c.refuses ? ` · ${c.refuses} refusé(s)` : ''}</p>` : ''; })()}
          <div id="msgDocs"></div>
          ${documents.filter(d => d.statut !== 'non_requis').sort((a, b) => a.type.localeCompare(b.type)).map(doc => renderDocRow(doc)).join('') || '<p style="color:var(--texte-clair);font-size:.85rem;">Aucun document.</p>'}

          ${documents.some(d => d.statut === 'non_requis') ? `
          <p style="margin-top:14px;">
            <button class="app-btn app-btn-sm app-btn-outline" id="toggleNonRequisBtn">${showNonRequis ? 'Masquer' : 'Afficher'} les documents non requis (${documents.filter(d => d.statut === 'non_requis').length})</button>
          </p>
          ${showNonRequis ? documents.filter(d => d.statut === 'non_requis').sort((a, b) => a.type.localeCompare(b.type)).map(doc => renderDocRow(doc)).join('') : ''}
          ` : ''}

          <h3>Ajouter un document</h3>
          <div id="msgAddDoc"></div>
          <form id="addDocForm" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
            <div class="app-field" style="margin:0;min-width:200px;"><label>Type</label>
              <select name="type" required>
                <option value="">— Choisir —</option>
                ${ALL_DOCUMENT_TYPES.filter(t => !documents.some(d => d.type === t.value)).map(t => `<option value="${t.value}">${t.label}</option>`).join('')}
              </select>
            </div>
            <div class="app-field" style="margin:0;"><label>Fichier</label><input type="file" name="file" required /></div>
            <div class="app-field" style="margin:0;"><label>Qui fournit</label>
              <select name="document_source">${opt(DOCUMENT_SOURCES, 'admin')}</select>
            </div>
            <div class="app-field" style="margin:0;"><label>Visibilité</label>
              <select name="client_visible"><option value="true">Visible par le client</option><option value="false">Interne uniquement</option></select>
            </div>
            <div class="app-field" style="margin:0;flex:1;min-width:180px;"><label>Commentaire (facultatif)</label><input type="text" name="commentaire" /></div>
            <button type="submit" class="app-btn app-btn-sm">Ajouter le document</button>
          </form>
        </div>

        ${dossier.client_type !== 'colony' ? `
        <div class="app-card">
          <h2>${dossier.client_type === 'group' ? 'Effectifs, besoins & régimes alimentaires' : 'Effectifs, niveaux & régimes alimentaires'}</h2>
          <div id="msgEffectifs"></div>
          <form id="effectifsForm">
            ${dossier.client_type === 'school' ? `
            <h3>Niveaux</h3>
            <div class="app-grid-3">
              ${NIVEAUX.map(n => `<div class="app-field"><label>${n.label}</label><input type="number" min="0" name="niveau_${n.key}" value="${(dossier.niveaux && dossier.niveaux[n.key]) || 0}" /></div>`).join('')}
            </div>
            <h3>Effectifs prévisionnels</h3>
            <div class="app-grid-3">
              <div class="app-field"><label>Élèves</label><input type="number" min="0" name="effectif_prev_eleves" value="${dossier.effectif_prev_eleves ?? ''}" /></div>
              <div class="app-field"><label>Professeurs</label><input type="number" min="0" name="effectif_prev_profs" value="${dossier.effectif_prev_profs ?? ''}" /></div>
              <div class="app-field"><label>Accompagnateurs</label><input type="number" min="0" name="effectif_prev_accompagnateurs" value="${dossier.effectif_prev_accompagnateurs ?? ''}" /></div>
            </div>
            <h3>Effectifs définitifs</h3>
            <div class="app-grid-3">
              <div class="app-field"><label>Élèves</label><input type="number" min="0" name="effectif_def_eleves" value="${dossier.effectif_def_eleves ?? ''}" /></div>
              <div class="app-field"><label>Professeurs</label><input type="number" min="0" name="effectif_def_profs" value="${dossier.effectif_def_profs ?? ''}" /></div>
              <div class="app-field"><label>Accompagnateurs</label><input type="number" min="0" name="effectif_def_accompagnateurs" value="${dossier.effectif_def_accompagnateurs ?? ''}" /></div>
            </div>` : `
            <h3>Effectifs</h3>
            <div class="app-grid-2">
              <div class="app-field"><label>Nombre d'adultes</label><input type="number" min="0" name="nb_adultes" value="${dossier.nb_adultes ?? ''}" /></div>
              <div class="app-field"><label>Nombre d'enfants</label><input type="number" min="0" name="nb_enfants" value="${dossier.nb_enfants ?? ''}" /></div>
            </div>
            <div class="app-field"><label>Besoins particuliers (salle, matériel, allergies…)</label><textarea name="besoins_particuliers" rows="2">${esc(dossier.besoins_particuliers)}</textarea></div>
            `}
            <div class="app-field"><label>Remarques alimentaires</label><textarea name="remarques_alimentaires" rows="2">${esc(dossier.remarques_alimentaires)}</textarea></div>
            <button type="submit" class="app-btn">Enregistrer</button>
          </form>
          <h3>Régimes alimentaires</h3>
          <form id="regimesForm">
            <div class="app-grid-3">
              ${REGIMES.map(r => {
                const row = regimes.find(x => x.type === r.value);
                return `<div class="app-field"><label>${r.label}</label><input type="number" min="0" name="regime_${r.value}" value="${row ? row.nombre : 0}" /></div>`;
              }).join('')}
            </div>
            <button type="submit" class="app-btn">Enregistrer les régimes</button>
          </form>
        </div>` : ''}

        <div class="app-card">
          <h2>Accès client</h2>
          <div id="msgTeacher"></div>
          ${acces.length ? acces.map(a => {
            const p = a.profiles;
            const statutInfo = ACCESS_STATUTS.find(s => s.value === a.statut) || {};
            return `
            <div class="app-doc-row">
              <span class="app-doc-name">${esc(p?.email || '—')} ${p?.full_name ? '(' + esc(p.full_name) + ')' : ''}</span>
              <span class="app-badge app-badge-${statutInfo.color || 'gray'}">${statutInfo.label || a.statut}</span>
              ${a.statut === 'desactive'
                ? `<button class="app-btn app-btn-sm app-btn-outline" data-toggle-access="enable" data-user-id="${p?.id}">Réactiver</button>`
                : `
                  <button class="app-btn app-btn-sm app-btn-outline" data-resend-access="${esc(p?.email || '')}" data-name="${esc(p?.full_name || '')}">Renvoyer l'invitation</button>
                  <button class="app-btn app-btn-sm app-btn-danger" data-toggle-access="disable" data-user-id="${p?.id}">Désactiver</button>
                `}
            </div>`;
          }).join('') : `<p style="font-size:.85rem;color:var(--texte-clair);margin-bottom:12px;">Aucun accès créé. À faire une fois le devis accepté.</p>`}
          <form id="teacherForm" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:16px;">
            <div class="app-field" style="margin:0;"><label>Nom</label><input type="text" name="fullName" /></div>
            <div class="app-field" style="margin:0;flex:1;min-width:200px;"><label>E-mail *</label><input type="email" name="email" required /></div>
            <button type="submit" class="app-btn app-btn-sm">Créer / ajouter un accès client</button>
          </form>
        </div>

        <div class="app-card">
          <h2>Historique</h2>
          <ul class="app-todo-list">
            ${buildTimeline().map(h => `<li><span class="app-todo-dot"></span>${esc(h.label)} ${h.details ? '— ' + esc(h.details) : ''} <span style="color:var(--texte-clair);font-size:.8rem;">— ${h.date}</span></li>`).join('') || '<li>Aucun historique.</li>'}
          </ul>
        </div>
      `;

      bindEvents();
      attachEstimationListeners();
    }

    function today() { return new Date().toISOString().slice(0, 10); }
    function showMsg(id, text, type='error') { const el = document.getElementById(id); if (el) el.innerHTML = `<div class="app-msg app-msg-${type}">${esc(text)}</div>`; }

    function bindEvents() {
      document.getElementById('generalForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const g = (k) => fd.get(k) || null;
        const gBool = (k) => (fd.has(k) && fd.get(k) !== '' ? fd.get(k) === 'true' : null);
        let payload = {
          statut: fd.get('statut'),
          date_proposee: g('date_proposee'),
          date_confirmee_debut: g('date_confirmee_debut'),
          date_confirmee_fin: g('date_confirmee_fin'),
          contact_nom: g('contact_nom'),
          contact_telephone: g('contact_telephone'),
          contact_email: g('contact_email'),
        };
        if (dossier.client_type === 'school') {
          payload = {
            ...payload,
            etablissement: fd.get('etablissement'),
            commune: g('commune'),
            code_postal: g('code_postal'),
            adresse: g('adresse'),
            programme: g('programme'),
            duree: fd.get('duree') ? Number(fd.get('duree')) : null,
          };
          const est = currentClassEstimate();
          if (est) payload.estimation_tarifaire = JSON.stringify(est);
        } else if (dossier.client_type === 'group') {
          payload = {
            ...payload,
            etablissement: fd.get('structure_nom'),
            structure_nom: fd.get('structure_nom'),
            structure_type: g('structure_type'),
            contact_prenom: g('contact_prenom'),
            contact_fonction: g('contact_fonction'),
            demande_date_arrivee: g('demande_date_arrivee'),
            demande_heure_arrivee: g('demande_heure_arrivee'),
            demande_date_depart: g('demande_date_depart'),
            demande_heure_depart: g('demande_heure_depart'),
            formule: g('formule'),
          };
        } else {
          payload = {
            ...payload,
            etablissement: `${fd.get('enfant_prenom')} ${fd.get('enfant_nom')}`,
            enfant_nom: fd.get('enfant_nom'),
            enfant_prenom: fd.get('enfant_prenom'),
            enfant_date_naissance: g('enfant_date_naissance'),
            enfant_sexe: g('enfant_sexe'),
            colonie_nom: g('colonie_nom'),
            beneficiaire_vacaf: gBool('beneficiaire_vacaf'),
            numero_allocataire: g('numero_allocataire'),
            tarif_colonie: fd.get('tarif_colonie') ? Number(fd.get('tarif_colonie')) : null,
            autorisation_partage_prive: gBool('autorisation_partage_prive'),
            autorisation_communication_publique: gBool('autorisation_communication_publique'),
          };
        }
        const { error } = await supabase.from('dossiers').update(payload).eq('id', dossierId);
        if (error) return showMsg('msgGeneral', error.message);
        showMsg('msgGeneral', 'Enregistré.', 'success');
        await loadAll();
      });

      document.getElementById('financeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const num = (v) => (v === '' || v === null ? null : Number(v));
        const payload = {
          montant_devis: num(fd.get('montant_devis')),
          acompte_attendu: num(fd.get('acompte_attendu')),
          acompte_recu: num(fd.get('acompte_recu')),
          date_acompte: fd.get('date_acompte') || null,
          montant_facture: num(fd.get('montant_facture')),
        };
        if (dossier.client_type === 'school') {
          payload.part_mairie_prevue = num(fd.get('part_mairie_prevue'));
          payload.part_mairie_recue = num(fd.get('part_mairie_recue'));
        }
        if (dossier.client_type === 'group' && fd.has('estimation_montant')) {
          payload.estimation_montant = num(fd.get('estimation_montant'));
        }
        const { error } = await supabase.from('dossiers').update(payload).eq('id', dossierId);
        if (error) return showMsg('msgFinance', error.message);
        showMsg('msgFinance', 'Enregistré.', 'success');
        await loadAll();
      });

      document.getElementById('paiementForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
          dossier_id: dossierId,
          montant: Number(fd.get('montant')),
          type: fd.get('type'),
          date_paiement: fd.get('date_paiement'),
          note: fd.get('note') || null,
          created_by: session.user.id,
        };
        const { error } = await supabase.from('paiements').insert(payload);
        if (error) return showMsg('msgPaiement', error.message);
        showMsg('msgPaiement', 'Paiement ajouté.', 'success');
        await loadAll();
      });

      document.querySelectorAll('[data-rapprocher]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.rapprocher;
          const montant = Number(btn.dataset.montant);
          const date_paiement = btn.dataset.date;
          const { data: paiement, error: pErr } = await supabase.from('paiements')
            .insert({ dossier_id: dossierId, montant, type: 'autre', date_paiement, note: 'Rapproché depuis un signalement enseignant', created_by: session.user.id })
            .select().single();
          if (pErr) return showMsg('msgSignalement', pErr.message);
          const { error: sErr } = await supabase.from('signalements_paiement')
            .update({ statut: 'rapproche', paiement_id: paiement.id }).eq('id', id);
          if (sErr) return showMsg('msgSignalement', sErr.message);
          await loadAll();
        });
      });
      document.querySelectorAll('[data-ignorer]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const { error } = await supabase.from('signalements_paiement').update({ statut: 'ignore' }).eq('id', btn.dataset.ignorer);
          if (error) return showMsg('msgSignalement', error.message);
          await loadAll();
        });
      });

      document.querySelectorAll('[data-doc-statut]').forEach(sel => {
        sel.addEventListener('change', async () => {
          const type = sel.dataset.docStatut;
          const statut = sel.value;
          const payload = { statut };
          if (statut === 'valide') { payload.validated_by = session.user.id; payload.validated_at = new Date().toISOString(); }
          if (statut === 'refuse') {
            const motif = window.prompt('Motif du refus (obligatoire, sera communiqué au client) :');
            if (!motif || !motif.trim()) { showMsg('msgDocs', 'Refus annulé : un motif est obligatoire.'); await loadAll(); return; }
            payload.refus_motif = motif.trim();
          } else {
            payload.refus_motif = null;
          }
          const { error } = await supabase.from('documents').update(payload).eq('dossier_id', dossierId).eq('type', type);
          if (error) { showMsg('msgDocs', error.message); return; }
          if (statut === 'refuse') {
            const { data: { session: s2 } } = await supabase.auth.getSession();
            await fetch('/api/admin/send-relance', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${s2.access_token}` },
              body: JSON.stringify({ dossierId, kind: 'document-refuse', documentType: labelForDocumentType(type), refusMotif: payload.refus_motif }),
            }).catch(() => {});
          }
          showMsg('msgDocs', 'Statut mis à jour.', 'success');
          await loadAll();
        });
      });

      document.querySelectorAll('[data-doc-visible]').forEach(sel => {
        sel.addEventListener('change', async () => {
          const type = sel.dataset.docVisible;
          const { error } = await supabase.from('documents').update({ client_visible: sel.value === 'true' }).eq('dossier_id', dossierId).eq('type', type);
          if (error) return showMsg('msgDocs', error.message);
          await loadAll();
        });
      });

      document.querySelectorAll('[data-doc-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!window.confirm('Supprimer cette ligne de document (et son éventuel fichier) ?')) return;
          const type = btn.dataset.docDelete;
          const doc = documents.find(d => d.type === type);
          if (doc && doc.storage_path) {
            await supabase.storage.from('documents-dossiers').remove([doc.storage_path]);
          }
          const { error } = await supabase.from('documents').delete().eq('dossier_id', dossierId).eq('type', type);
          if (error) return showMsg('msgDocs', error.message);
          await supabase.from('dossier_journal').insert({ dossier_id: dossierId, action: 'document_supprime', details: 'Supprimé par l\'admin : ' + type, actor: session.user.id });
          await loadAll();
        });
      });

      document.querySelectorAll('[data-doc-upload]').forEach(input => {
        input.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const type = input.dataset.docUpload;
          await uploadDocumentFile(type, file);
        });
      });

      const addDocForm = document.getElementById('addDocForm');
      if (addDocForm) {
        addDocForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(addDocForm);
          const type = fd.get('type');
          const file = fd.get('file');
          if (!type || !file || !file.name) { showMsg('msgAddDoc', 'Type et fichier obligatoires.'); return; }
          try {
            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const path = `${dossierId}/${type}/${Date.now()}_${safeName}`;
            const { error: upErr } = await supabase.storage.from('documents-dossiers').upload(path, file, { upsert: true });
            if (upErr) throw upErr;
            const { error: insErr } = await supabase.from('documents').insert({
              dossier_id: dossierId, type, storage_path: path, file_name: file.name, statut: 'recu',
              document_source: fd.get('document_source'), client_visible: fd.get('client_visible') === 'true',
              commentaire: fd.get('commentaire') || null,
            });
            if (insErr) throw insErr;
            showMsg('msgAddDoc', 'Document ajouté.', 'success');
            await maybeSendDocumentEmail(type, fd.get('client_visible') === 'true');
            await loadAll();
          } catch (error) {
            showMsg('msgAddDoc', error.message || 'Échec de l\'ajout.');
          }
        });
      }

      const toggleNonRequisBtn = document.getElementById('toggleNonRequisBtn');
      if (toggleNonRequisBtn) toggleNonRequisBtn.addEventListener('click', () => { showNonRequis = !showNonRequis; render(); });

      document.querySelectorAll('[data-download]').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          const path = a.dataset.download;
          if (!path) return;
          const { data, error } = await supabase.storage.from('documents-dossiers').createSignedUrl(path, 60);
          if (error) return showMsg('msgDocs', error.message);
          window.open(data.signedUrl, '_blank');
        });
      });

      const effectifsForm = document.getElementById('effectifsForm');
      if (effectifsForm) {
        effectifsForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          let payload = { remarques_alimentaires: fd.get('remarques_alimentaires') || null };
          if (dossier.client_type === 'school') {
            const niveaux = {};
            NIVEAUX.forEach(n => { niveaux[n.key] = Number(fd.get(`niveau_${n.key}`)) || 0; });
            payload = {
              ...payload,
              niveaux,
              effectif_prev_eleves: fd.get('effectif_prev_eleves') ? Number(fd.get('effectif_prev_eleves')) : null,
              effectif_prev_profs: fd.get('effectif_prev_profs') ? Number(fd.get('effectif_prev_profs')) : null,
              effectif_prev_accompagnateurs: fd.get('effectif_prev_accompagnateurs') ? Number(fd.get('effectif_prev_accompagnateurs')) : null,
              effectif_def_eleves: fd.get('effectif_def_eleves') ? Number(fd.get('effectif_def_eleves')) : null,
              effectif_def_profs: fd.get('effectif_def_profs') ? Number(fd.get('effectif_def_profs')) : null,
              effectif_def_accompagnateurs: fd.get('effectif_def_accompagnateurs') ? Number(fd.get('effectif_def_accompagnateurs')) : null,
            };
            const est = computeClassEstimate({
              programme: dossier.programme,
              duree: dossier.duree,
              nbEleves: payload.effectif_prev_eleves,
              nbProfs: payload.effectif_prev_profs,
              nbAccompagnateurs: payload.effectif_prev_accompagnateurs,
            });
            if (est) payload.estimation_tarifaire = JSON.stringify(est);
          } else if (dossier.client_type === 'group') {
            payload = {
              ...payload,
              nb_adultes: fd.get('nb_adultes') ? Number(fd.get('nb_adultes')) : null,
              nb_enfants: fd.get('nb_enfants') ? Number(fd.get('nb_enfants')) : null,
              besoins_particuliers: fd.get('besoins_particuliers') || null,
            };
          }
          const { error } = await supabase.from('dossiers').update(payload).eq('id', dossierId);
          if (error) return showMsg('msgEffectifs', error.message);
          showMsg('msgEffectifs', 'Enregistré.', 'success');
          await loadAll();
        });
      }

      const regimesForm = document.getElementById('regimesForm');
      if (regimesForm) {
        regimesForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          try {
            for (const r of REGIMES) {
              const nombre = Number(fd.get(`regime_${r.value}`)) || 0;
              const { error } = await supabase.from('regimes_alimentaires').update({ nombre }).eq('dossier_id', dossierId).eq('type', r.value);
              if (error) throw error;
            }
            showMsg('msgEffectifs', 'Régimes enregistrés.', 'success');
            await loadAll();
          } catch (error) { showMsg('msgEffectifs', error.message); }
        });
      }

      const teacherForm = document.getElementById('teacherForm');
      if (teacherForm) {
        teacherForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          await createTeacherAccess(fd.get('email'), fd.get('fullName'));
        });
      }
      document.querySelectorAll('[data-resend-access]').forEach(btn => {
        btn.addEventListener('click', () => createTeacherAccess(btn.dataset.resendAccess, btn.dataset.name));
      });
      document.querySelectorAll('[data-toggle-access]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const action = btn.dataset.toggleAccess;
          const userId = btn.dataset.userId;
          if (!userId) return;
          showMsg('msgTeacher', action === 'disable' ? 'Désactivation…' : 'Réactivation…', 'info');
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const res = await fetch('/api/admin/toggle-client-access', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ dossierId, userId, action }),
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Échec.');
            showMsg('msgTeacher', action === 'disable' ? 'Accès désactivé.' : 'Accès réactivé.', 'success');
            await loadAll();
          } catch (error) {
            showMsg('msgTeacher', error.message);
          }
        });
      });

      document.querySelectorAll('[data-quick-action]').forEach(btn => {
        btn.addEventListener('click', () => onQuickAction(btn.dataset.quickAction));
      });
      const relanceBtn = document.getElementById('sendRelanceBtn');
      if (relanceBtn) relanceBtn.addEventListener('click', onSendRelance);

      document.querySelectorAll('[data-archive-toggle]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const archiving = btn.dataset.archiveToggle === 'archive';
          const { error } = await supabase.from('dossiers').update({ archived_at: archiving ? new Date().toISOString() : null }).eq('id', dossierId);
          if (error) return showMsg('msgActions', error.message);
          await supabase.from('dossier_journal').insert({ dossier_id: dossierId, action: archiving ? 'dossier_archive' : 'dossier_restaure', actor: session.user.id });
          showMsg('msgActions', archiving ? 'Dossier archivé.' : 'Dossier restauré.', 'success');
          await loadAll();
        });
      });

      const openDeleteBtn = document.getElementById('openDeleteBtn');
      if (openDeleteBtn) openDeleteBtn.addEventListener('click', () => { deletePanelOpen = true; render(); });
      const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
      if (cancelDeleteBtn) cancelDeleteBtn.addEventListener('click', () => { deletePanelOpen = false; render(); });
      const deleteConfirmInput = document.getElementById('deleteConfirmInput');
      const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
      if (deleteConfirmInput && confirmDeleteBtn) {
        deleteConfirmInput.addEventListener('input', () => {
          confirmDeleteBtn.disabled = deleteConfirmInput.value.trim() !== 'SUPPRIMER';
        });
        confirmDeleteBtn.addEventListener('click', onDeletePermanently);
      }
    }

    // Nettoyage récursif du dossier de stockage (convention <dossierId>/<type>/<fichier>) :
    // supprime tous les fichiers, y compris ceux non rattachés à une ligne "documents"
    // (ex. pages supplémentaires d'un carnet de vaccination).
    async function removeAllDossierFiles() {
      const { data: topLevel } = await supabase.storage.from('documents-dossiers').list(dossierId);
      for (const entry of topLevel || []) {
        const subPath = `${dossierId}/${entry.name}`;
        const { data: subFiles } = await supabase.storage.from('documents-dossiers').list(subPath);
        if (subFiles && subFiles.length) {
          await supabase.storage.from('documents-dossiers').remove(subFiles.map(f => `${subPath}/${f.name}`));
        } else {
          await supabase.storage.from('documents-dossiers').remove([subPath]);
        }
      }
    }

    async function onDeletePermanently() {
      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;
      btn.textContent = 'Suppression en cours…';
      try {
        await removeAllDossierFiles();
        const { error } = await supabase.from('dossiers').delete().eq('id', dossierId);
        if (error) throw error;
        window.location.href = 'dashboard.html';
      } catch (error) {
        showMsg('msgActions', 'Échec de la suppression : ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Supprimer définitivement';
      }
    }

    async function onQuickAction(action) {
      const statutMap = { valider: 'demande_validee', refuser: 'refusee', devis_envoye: 'devis_envoye' };
      if (action === 'relance') {
        document.getElementById('relancePanel').style.display = 'block';
        return;
      }
      const nouveauStatut = statutMap[action];
      if (!nouveauStatut) return;
      const { error } = await supabase.from('dossiers').update({ statut: nouveauStatut }).eq('id', dossierId);
      if (error) return showMsg('msgActions', error.message);
      showMsg('msgActions', 'Statut mis à jour.', 'success');
      await loadAll();
    }

    async function onSendRelance() {
      const message = document.getElementById('relanceMessage').value.trim();
      showMsg('msgActions', 'Envoi en cours…', 'info');
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const res = await fetch('/api/admin/send-relance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ dossierId, message }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Échec.');
        showMsg('msgActions', 'Relance envoyée.', 'success');
        document.getElementById('relancePanel').style.display = 'none';
        await loadAll();
      } catch (error) {
        showMsg('msgActions', error.message);
      }
    }

    async function uploadDocumentFile(type, file) {
      try {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${dossierId}/${type}/${Date.now()}_${safeName}`;
        const { error: upErr } = await supabase.storage.from('documents-dossiers').upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        const { error: updErr } = await supabase.from('documents').update({ storage_path: path, file_name: file.name, statut: 'recu' }).eq('dossier_id', dossierId).eq('type', type);
        if (updErr) throw updErr;
        const doc = documents.find(d => d.type === type);
        showMsg('msgDocs', 'Document mis à jour.', 'success');
        await maybeSendDocumentEmail(type, doc ? doc.client_visible : true);
        await loadAll();
      } catch (error) {
        showMsg('msgDocs', error.message || 'Échec du dépôt.');
      }
    }

    async function maybeSendDocumentEmail(type, clientVisible) {
      if (!clientVisible || !['devis', 'facture', 'facture_finale'].includes(type)) return;
      try {
        const { data: { session: s2 } } = await supabase.auth.getSession();
        const res = await fetch('/api/admin/send-relance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${s2.access_token}` },
          body: JSON.stringify({ dossierId, kind: 'document-added', documentType: type }),
        });
        const json = await res.json();
        if (json.emailSent) showMsg('msgDocs', 'Document enregistré, e-mail envoyé au client.', 'success');
      } catch { /* non bloquant */ }
    }

    async function createTeacherAccess(email, fullName) {
      showMsg('msgTeacher', 'Création en cours…', 'info');
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const res = await fetch('/api/admin/create-teacher', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ dossierId, email, fullName }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Échec.');
        showMsg('msgTeacher', json.emailSent ? 'E-mail envoyé avec succès.' : `Accès enregistré mais l'e-mail n'a pas pu être envoyé (${esc(json.emailError || '')}).`, json.emailSent ? 'success' : 'info');
        await loadAll();
      } catch (error) {
        showMsg('msgTeacher', error.message);
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
