<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Administration | Les Hortensias</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body class="app-body">

  <div class="app-topbar">
    <div class="app-logo"><span>🌸</span><span>Administration — Les Hortensias</span></div>
    <div class="app-user">
      <span id="userLabel"></span>
      <button class="app-logout" id="notifBtn">🔔 Notifications <span id="notifBadge"></span></button>
      <a href="nouveau-dossier.html" class="app-btn app-btn-sm">+ Nouveau dossier</a>
      <a href="parametres.html" class="app-btn app-btn-sm app-btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);">⚙️ Paramètres</a>
      <button class="app-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="app-container" style="padding-bottom:0;">
    <div id="notifPanel" class="app-card" style="display:none;"></div>
  </div>
  <div class="app-container" id="appRoot" style="padding-top:0;">
    <div class="app-loading">Chargement…</div>
  </div>

  <script type="module">
    import { getSupabaseClient } from '../lib/supabaseClient.js';
    import { STATUTS, CLIENT_TYPES, JOURNAL_LABELS, labelOf, formatDateFr, formatMontant, docCompleteness } from '../lib/appConstants.js';

    const root = document.getElementById('appRoot');
    let supabase, dossiers = [], documentsByDossier = {}, activeFilter = null, typeFilter = null, archiveFilter = 'active', searchTerm = '', notifications = [], recentActivity = [];

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function init() {
      try { supabase = await getSupabaseClient(); }
      catch (e) { root.innerHTML = `<div class="app-msg app-msg-error">${esc(e.message)}</div>`; return; }

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (!profile || profile.role !== 'admin') { await supabase.auth.signOut(); window.location.href = 'index.html'; return; }
      document.getElementById('userLabel').textContent = profile.full_name || profile.email || '';

      if (profile.email !== session.user.email) {
        await supabase.from('profiles').update({ email: session.user.email }).eq('id', session.user.id);
      }

      supabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') window.location.href = 'index.html'; });

      await loadAll();
    }

    async function loadAll() {
      const { data: d, error } = await supabase.from('dossiers').select('*').order('created_at', { ascending: false });
      if (error) { root.innerHTML = `<div class="app-msg app-msg-error">${esc(error.message)}</div>`; return; }
      dossiers = d || [];

      const { data: docs } = await supabase.from('documents').select('dossier_id, type, statut');
      documentsByDossier = {};
      (docs || []).forEach(doc => {
        (documentsByDossier[doc.dossier_id] = documentsByDossier[doc.dossier_id] || []).push(doc);
      });

      const { data: notifs } = await supabase.from('notifications').select('*').eq('audience', 'admin').order('created_at', { ascending: false }).limit(50);
      notifications = notifs || [];
      updateNotifBadge();

      const { data: journal } = await supabase.from('dossier_journal').select('*, dossiers(numero, etablissement)').order('created_at', { ascending: false }).limit(15);
      recentActivity = journal || [];

      render();
    }

    function updateNotifBadge() {
      const unread = notifications.filter(n => !n.lu).length;
      document.getElementById('notifBadge').textContent = unread ? `(${unread})` : '';
    }

    function renderNotifPanel() {
      const panel = document.getElementById('notifPanel');
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="margin:0;">Notifications</h2>
          <button class="app-btn app-btn-sm app-btn-outline" id="markAllReadBtn">Tout marquer comme lu</button>
        </div>
        <ul class="app-todo-list">
          ${notifications.map(n => `
            <li style="cursor:pointer;${n.lu ? 'opacity:.55;' : ''}" data-notif-id="${n.id}" data-notif-dossier="${n.dossier_id || ''}">
              <span class="app-todo-dot" style="background:${n.lu ? 'var(--beige-fonce)' : 'var(--or)'};"></span>
              ${esc(n.message)} <span style="color:var(--texte-clair);font-size:.78rem;">— ${new Date(n.created_at).toLocaleString('fr-FR')}</span>
            </li>`).join('') || '<li>Aucune notification.</li>'}
        </ul>
      `;
      document.getElementById('markAllReadBtn').addEventListener('click', async () => {
        await supabase.from('notifications').update({ lu: true }).eq('lu', false);
        await loadAll();
        renderNotifPanel();
      });
      panel.querySelectorAll('[data-notif-id]').forEach(li => {
        li.addEventListener('click', async () => {
          await supabase.from('notifications').update({ lu: true }).eq('id', li.dataset.notifId);
          if (li.dataset.notifDossier) window.location.href = `dossier.html?id=${li.dataset.notifDossier}`;
          else { await loadAll(); renderNotifPanel(); }
        });
      });
    }

    document.getElementById('notifBtn').addEventListener('click', () => {
      const panel = document.getElementById('notifPanel');
      const showing = panel.style.display !== 'none';
      if (showing) { panel.style.display = 'none'; return; }
      renderNotifPanel();
      panel.style.display = 'block';
    });

    function today() { return new Date().toISOString().slice(0, 10); }

    function matchesFilter(d, filter) {
      const t = today();
      switch (filter) {
        case 'a_venir': return !['annule', 'cloture', 'sejour_termine'].includes(d.statut) && (d.date_confirmee_debut ? d.date_confirmee_debut > t : true);
        case 'en_cours': return d.statut === 'sejour_en_cours' || (d.date_confirmee_debut && d.date_confirmee_fin && d.date_confirmee_debut <= t && d.date_confirmee_fin >= t);
        case 'passes': return ['sejour_termine', 'facture_envoyee', 'solde_attendu', 'solde', 'cloture'].includes(d.statut);
        case 'annules': return d.statut === 'annule';
        case 'acomptes_manquants': return d.acompte_attendu && (!d.acompte_recu || Number(d.acompte_recu) < Number(d.acompte_attendu));
        case 'incomplets': return d.statut === 'dossier_incomplet';
        case 'soldes': return d.statut === 'solde_attendu' || (d.montant_facture && Number(d.montant_paye || 0) < Number(d.montant_facture));
        default: return true;
      }
    }

    function matchesSearch(d, term) {
      if (!term) return true;
      const hay = `${d.etablissement || ''} ${d.commune || ''} ${d.numero || ''} ${d.structure_nom || ''} ${d.enfant_nom || ''} ${d.enfant_prenom || ''} ${d.contact_nom || ''} ${d.contact_email || ''} ${d.contact_telephone || ''}`.toLowerCase();
      return hay.includes(term.toLowerCase());
    }

    function matchesArchiveFilter(d) {
      if (archiveFilter === 'all') return true;
      if (archiveFilter === 'archived') return !!d.archived_at;
      return !d.archived_at; // 'active'
    }

    function filteredDossiers() {
      return dossiers.filter(d => matchesFilter(d, activeFilter) && matchesSearch(d, searchTerm) && (!typeFilter || d.client_type === typeFilter) && matchesArchiveFilter(d));
    }

    function buildAlerts() {
      const actifs = dossiers.filter(d => !d.archived_at);
      const acomptesManquants = actifs.filter(d => matchesFilter(d, 'acomptes_manquants')).length;
      const devisNonSignes = actifs.filter(d => ['devis_envoye'].includes(d.statut)).length;
      const incomplets = actifs.filter(d => d.statut === 'dossier_incomplet').length;
      const soldes = actifs.filter(d => matchesFilter(d, 'soldes')).length;
      const total = acomptesManquants + devisNonSignes + incomplets + soldes;
      return { acomptesManquants, devisNonSignes, incomplets, soldes, total };
    }

    function docBadge(dossierId) {
      const c = docCompleteness(documentsByDossier[dossierId] || []);
      if (!c.total) return '—';
      if (c.complete) return `<span class="app-badge app-badge-green">✅ ${c.valides}/${c.total}</span>`;
      if (c.valides === 0) return `<span class="app-badge app-badge-red">❌ ${c.total - c.valides} manquant${c.total - c.valides > 1 ? 's' : ''}</span>`;
      return `<span class="app-badge app-badge-orange">⚠️ ${c.valides}/${c.total}</span>`;
    }

    function typeBadge(clientType) {
      const info = CLIENT_TYPES.find(t => t.value === clientType) || CLIENT_TYPES[0];
      return `<span class="app-badge app-badge-gray">${info.badge} ${info.label}</span>`;
    }

    function nouvellesDemandes() {
      return dossiers.filter(d => d.source === 'public' && d.statut === 'demande_recue' && !d.archived_at);
    }

    function demandeSummary(d) {
      if (d.client_type === 'group') {
        const total = (d.nb_adultes || 0) + (d.nb_enfants || 0);
        return `${total || '?'} personnes · ${d.demande_date_arrivee ? formatDateFr(d.demande_date_arrivee) : 'dates non précisées'}`;
      }
      if (d.client_type === 'colony') {
        return `${esc(d.enfant_prenom || '')} ${esc(d.enfant_nom || '')} · ${esc(d.colonie_nom || 'colonie non précisée')}`;
      }
      return `${d.programme === 'volcan' ? 'Volcan' : 'Nature'} · ${d.duree ? d.duree + 'j' : '—'} · ${esc(d.periode_souhaitee || 'période non précisée')} · ${d.effectif_prev_eleves ?? '?'} élèves`;
    }

    function render() {
      const alerts = buildAlerts();
      const list = filteredDossiers();
      const demandes = nouvellesDemandes();

      root.innerHTML = `
        ${demandes.length > 0 ? `
        <div class="app-card">
          <h2>${demandes.length} nouvelle${demandes.length > 1 ? 's' : ''} demande${demandes.length > 1 ? 's' : ''} à traiter</h2>
          ${demandes.map(d => `
            <div class="app-doc-row">
              <span class="app-doc-name">${typeBadge(d.client_type)} ${esc(d.etablissement)} — ${demandeSummary(d)}</span>
              <span style="font-size:.78rem;color:var(--texte-clair);">${new Date(d.created_at).toLocaleDateString('fr-FR')}</span>
              <a class="app-btn app-btn-sm app-btn-outline" href="dossier.html?id=${d.id}">Ouvrir</a>
              <button class="app-btn app-btn-sm" data-demande-action="valider" data-demande-id="${d.id}">Valider</button>
              <button class="app-btn app-btn-sm app-btn-outline" data-demande-action="refuser" data-demande-id="${d.id}">Refuser</button>
              <button class="app-btn app-btn-sm app-btn-outline" data-archive-toggle="archive" data-dossier-id="${d.id}">Archiver</button>
            </div>
          `).join('')}
        </div>` : ''}

        <div class="app-card">
          <h2>Activité récente</h2>
          <ul class="app-todo-list">
            ${recentActivity.map(a => `
              <li>
                <span class="app-todo-dot"></span>
                ${a.dossiers ? `<a href="dossier.html?id=${a.dossier_id}" style="color:var(--vert-fonce);font-weight:700;">${esc(a.dossiers.etablissement)}</a> — ` : ''}
                ${esc(JOURNAL_LABELS[a.action] || a.action)}${a.details ? ' : ' + esc(a.details) : ''}
                <span style="color:var(--texte-clair);font-size:.78rem;"> — ${new Date(a.created_at).toLocaleString('fr-FR')}</span>
              </li>`).join('') || '<li>Aucune activité récente.</li>'}
          </ul>
        </div>

        ${alerts.total > 0 ? `
        <div class="app-card">
          <h2>${alerts.total} dossier${alerts.total > 1 ? 's' : ''} nécessite${alerts.total > 1 ? 'nt' : ''} votre attention</h2>
          <ul class="app-todo-list">
            ${alerts.acomptesManquants ? `<li><span class="app-todo-dot"></span>${alerts.acomptesManquants} acompte(s) manquant(s)</li>` : ''}
            ${alerts.devisNonSignes ? `<li><span class="app-todo-dot"></span>${alerts.devisNonSignes} devis en attente de signature</li>` : ''}
            ${alerts.incomplets ? `<li><span class="app-todo-dot"></span>${alerts.incomplets} dossier(s) incomplet(s)</li>` : ''}
            ${alerts.soldes ? `<li><span class="app-todo-dot"></span>${alerts.soldes} solde(s) en attente</li>` : ''}
          </ul>
        </div>` : ''}

        <div class="app-card">
          <div class="app-filters">
            <input type="search" id="searchInput" placeholder="Rechercher client, numéro, e-mail, téléphone…" value="${esc(searchTerm)}" style="flex:1;min-width:220px;" />
          </div>
          <div class="app-filters" id="archiveFilters">
            <span class="app-chip ${archiveFilter === 'active' ? 'active' : ''}" data-archive-filter="active">Actifs</span>
            <span class="app-chip ${archiveFilter === 'archived' ? 'active' : ''}" data-archive-filter="archived">Archivés</span>
            <span class="app-chip ${archiveFilter === 'all' ? 'active' : ''}" data-archive-filter="all">Tous</span>
          </div>
          <div class="app-filters" id="typeFilters">
            <span class="app-chip ${!typeFilter ? 'active' : ''}" data-type-filter="">Tous types</span>
            ${CLIENT_TYPES.map(t => `<span class="app-chip ${typeFilter === t.value ? 'active' : ''}" data-type-filter="${t.value}">${t.badge} ${t.label}</span>`).join('')}
          </div>
          <div class="app-filters" id="chipFilters">
            ${['a_venir', 'en_cours', 'passes', 'annules', 'acomptes_manquants', 'incomplets', 'soldes'].map(f => `
              <span class="app-chip ${activeFilter === f ? 'active' : ''}" data-filter="${f}">${chipLabel(f)}</span>
            `).join('')}
            ${activeFilter ? `<span class="app-chip" data-filter="">✕ Effacer</span>` : ''}
          </div>

          <div class="app-table-wrap">
            <table class="app-table">
              <thead><tr>
                <th>Réf</th><th>Type</th><th>Client</th><th>Dates</th>
                <th>Documents</th><th>Devis</th><th>Facturé</th><th>Payé</th><th>Reste</th><th>Statut</th><th></th>
              </tr></thead>
              <tbody>
                ${list.map(d => `
                  <tr>
                    <td><a class="row-link" href="dossier.html?id=${d.id}">${esc(d.numero)}</a></td>
                    <td>${typeBadge(d.client_type)}</td>
                    <td>${esc(d.etablissement)}</td>
                    <td>${d.date_confirmee_debut ? formatDateFr(d.date_confirmee_debut) : (d.date_proposee ? formatDateFr(d.date_proposee) + ' (proposée)' : (d.demande_date_arrivee ? formatDateFr(d.demande_date_arrivee) + ' (demandée)' : '—'))}</td>
                    <td>${docBadge(d.id)}</td>
                    <td>${formatMontant(d.montant_devis)}</td>
                    <td>${formatMontant(d.montant_facture)}</td>
                    <td>${formatMontant(d.montant_paye)}</td>
                    <td>${d.montant_facture != null ? formatMontant(Number(d.montant_facture) - Number(d.montant_paye || 0)) : '—'}</td>
                    <td>
                      <span class="app-badge app-badge-gray">${labelOf(STATUTS, d.statut)}</span>
                      ${d.archived_at ? '<span class="app-badge app-badge-gray">📦 Archivé</span>' : ''}
                    </td>
                    <td style="white-space:nowrap;">
                      <a class="app-btn app-btn-sm app-btn-outline" href="dossier.html?id=${d.id}">Ouvrir</a>
                      ${d.archived_at
                        ? `<button class="app-btn app-btn-sm app-btn-outline" data-archive-toggle="restore" data-dossier-id="${d.id}">Restaurer</button>`
                        : `<button class="app-btn app-btn-sm app-btn-outline" data-archive-toggle="archive" data-dossier-id="${d.id}">Archiver</button>`}
                    </td>
                  </tr>
                `).join('') || `<tr><td colspan="11" style="text-align:center;padding:30px;">Aucun dossier ne correspond.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
      document.querySelectorAll('#chipFilters .app-chip').forEach(chip => {
        chip.addEventListener('click', () => { activeFilter = chip.dataset.filter || null; render(); });
      });
      document.querySelectorAll('#typeFilters .app-chip').forEach(chip => {
        chip.addEventListener('click', () => { typeFilter = chip.dataset.typeFilter || null; render(); });
      });
      document.querySelectorAll('#archiveFilters .app-chip').forEach(chip => {
        chip.addEventListener('click', () => { archiveFilter = chip.dataset.archiveFilter; render(); });
      });
      document.querySelectorAll('[data-demande-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const statutMap = { valider: 'demande_validee', refuser: 'refusee' };
          const { error } = await supabase.from('dossiers').update({ statut: statutMap[btn.dataset.demandeAction] }).eq('id', btn.dataset.demandeId);
          if (!error) await loadAll();
        });
      });
      document.querySelectorAll('[data-archive-toggle]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const archiving = btn.dataset.archiveToggle === 'archive';
          const payload = { archived_at: archiving ? new Date().toISOString() : null };
          const { error } = await supabase.from('dossiers').update(payload).eq('id', btn.dataset.dossierId);
          if (!error) {
            await supabase.from('dossier_journal').insert({
              dossier_id: btn.dataset.dossierId,
              action: archiving ? 'dossier_archive' : 'dossier_restaure',
            });
            await loadAll();
          }
        });
      });
    }

    function chipLabel(f) {
      return {
        a_venir: 'À venir', en_cours: 'En cours', passes: 'Passés', annules: 'Annulés',
        acomptes_manquants: 'Acomptes manquants', incomplets: 'Dossiers incomplets', soldes: 'Soldes en attente',
      }[f];
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const supabase = await getSupabaseClient();
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
