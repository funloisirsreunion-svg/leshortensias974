<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau dossier — Administration | Les Hortensias</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../app.css" />
  <style>
    .type-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (min-width: 640px) {
      .type-cards { grid-template-columns: repeat(3, 1fr); }
    }
    .type-card {
      display: block;
      width: 100%;
      cursor: pointer;
      box-sizing: border-box;
    }
    .type-card input {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .type-card-inner {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 104px;
      padding: 18px 12px;
      border: 2px solid var(--beige-fonce);
      border-radius: var(--radius);
      text-align: center;
      background: var(--gris-clair);
      transition: var(--transition);
    }
    .type-card input:checked + .type-card-inner {
      border-color: var(--vert-fonce);
      background: var(--beige-fonce);
    }
    .type-card-icon { font-size: 1.7rem; line-height: 1; }
    .type-card-label { font-weight: 700; font-size: .88rem; line-height: 1.3; }
    .type-card-link .type-card-inner { cursor: pointer; }
    .type-card-note { font-size: .78rem; font-weight: 400; color: var(--texte-clair); margin-top: 2px; }
  </style>
</head>
<body class="app-body">
  <div class="app-topbar">
    <div class="app-logo"><span>🌸</span><span>Administration — Les Hortensias</span></div>
    <div class="app-user">
      <a href="dashboard.html" class="app-btn app-btn-sm app-btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);">← Tableau de bord</a>
      <button class="app-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="app-container" style="max-width:700px;">
    <div class="app-card">
      <h2>Nouveau dossier</h2>
      <div id="msgBox"></div>

      <div class="type-cards" id="typeCards">
        <label class="type-card">
          <input type="radio" name="clientType" value="school" checked />
          <span class="type-card-inner"><span class="type-card-icon">🏫</span><span class="type-card-label">Classe de découverte</span></span>
        </label>
        <label class="type-card">
          <input type="radio" name="clientType" value="group" />
          <span class="type-card-inner"><span class="type-card-icon">👥</span><span class="type-card-label">Groupe indépendant</span></span>
        </label>
        <a class="type-card type-card-link" href="colonie.html?new=1">
          <span class="type-card-inner">
            <span class="type-card-icon">🏕️</span>
            <span class="type-card-label">Colonie de vacances<br/><span class="type-card-note">Créer un séjour →</span></span>
          </span>
        </a>
      </div>
      <p style="font-size:.82rem;color:var(--texte-clair);margin:-10px 0 22px;">
        Une colonie fonctionne différemment : on crée d'abord un <strong>séjour</strong> (ex. « Colonie Octobre 2026 »), puis les familles s'inscrivent dedans. Cliquez sur la carte ci-dessus pour créer un séjour.
      </p>

      <form id="form">
        <!-- ── Classe de découverte ── -->
        <div data-section="school">
          <div class="app-field"><label>Établissement *</label><input type="text" name="etablissement" /></div>
          <div class="app-grid-3">
            <div class="app-field"><label>Commune</label><input type="text" name="commune" /></div>
            <div class="app-field"><label>Code postal</label><input type="text" name="code_postal" inputmode="numeric" maxlength="10" /></div>
            <div class="app-field"><label>Adresse</label><input type="text" name="adresse" /></div>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Contact (nom)</label><input type="text" name="contact_nom" /></div>
            <div class="app-field"><label>Contact (prénom)</label><input type="text" name="contact_prenom" /></div>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Téléphone contact</label><input type="text" name="contact_telephone" /></div>
            <div class="app-field"><label>E-mail contact</label><input type="email" name="contact_email" /></div>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Programme</label>
              <select name="programme"><option value="">—</option><option value="nature">Nature</option><option value="volcan">Volcan</option></select>
            </div>
            <div class="app-field"><label>Durée</label>
              <select name="duree"><option value="">—</option><option value="3">3 jours</option><option value="4">4 jours</option><option value="5">5 jours</option></select>
            </div>
          </div>
          <div class="app-field"><label>Période souhaitée</label><input type="text" name="periode_souhaitee" placeholder="Ex : mars ou avril 2027" /></div>
        </div>

        <!-- ── Groupe indépendant ── -->
        <div data-section="group" style="display:none;">
          <div class="app-field"><label>Nom de la structure *</label><input type="text" name="structure_nom" /></div>
          <div class="app-field"><label>Type de structure</label>
            <select name="structure_type">
              <option value="">—</option>
              <option value="association">Association</option>
              <option value="club_sportif">Club sportif</option>
              <option value="entreprise">Entreprise</option>
              <option value="collectivite">Collectivité</option>
              <option value="famille">Famille / groupe privé</option>
              <option value="etablissement">Établissement</option>
              <option value="organisme_public">Organisme public</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Contact (nom)</label><input type="text" name="contact_nom" /></div>
            <div class="app-field"><label>Contact (prénom)</label><input type="text" name="contact_prenom" /></div>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Fonction</label><input type="text" name="contact_fonction" /></div>
            <div class="app-field"><label>Téléphone</label><input type="text" name="contact_telephone" /></div>
          </div>
          <div class="app-field"><label>E-mail</label><input type="email" name="contact_email" /></div>
          <div class="app-grid-2">
            <div class="app-field"><label>Date d'arrivée souhaitée</label><input type="date" name="demande_date_arrivee" /></div>
            <div class="app-field"><label>Heure d'arrivée</label><input type="time" name="demande_heure_arrivee" /></div>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Date de départ souhaitée</label><input type="date" name="demande_date_depart" /></div>
            <div class="app-field"><label>Heure de départ</label><input type="time" name="demande_heure_depart" /></div>
          </div>
          <div class="app-grid-2">
            <div class="app-field"><label>Nombre d'adultes</label><input type="number" min="0" name="nb_adultes" /></div>
            <div class="app-field"><label>Nombre d'enfants</label><input type="number" min="0" name="nb_enfants" /></div>
          </div>
          <div class="app-field"><label>Formule</label>
            <select name="formule">
              <option value="">—</option>
              <option value="pension_complete">Pension complète</option>
              <option value="demi_pension">Demi-pension</option>
              <option value="weekend">Forfait week-end</option>
              <option value="autre">Autre / sur devis</option>
            </select>
          </div>
        </div>

        <button type="submit" class="app-btn" id="submitBtn">Créer le dossier</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { getSupabaseClient } from '../lib/supabaseClient.js';

    const msgBox = document.getElementById('msgBox');
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submitBtn');
    let supabase;

    function showMsg(text, type = 'error') { msgBox.innerHTML = `<div class="app-msg app-msg-${type}">${text}</div>`; }

    function currentType() {
      return document.querySelector('input[name="clientType"]:checked').value;
    }

    function updateSections() {
      const type = currentType();
      document.querySelectorAll('[data-section]').forEach(section => {
        section.style.display = section.dataset.section === type ? 'block' : 'none';
      });
    }
    document.querySelectorAll('input[name="clientType"]').forEach(r => r.addEventListener('change', updateSections));
    updateSections();

    async function init() {
      supabase = await getSupabaseClient();
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
    }
    init();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true; submitBtn.textContent = 'Création…';
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const type = currentType();
        const section = document.querySelector(`[data-section="${type}"]`);
        const body = { clientType: type };
        section.querySelectorAll('input, select, textarea').forEach(el => {
          if (el.name) body[el.name] = el.value;
        });
        const res = await fetch('/api/admin/create-dossier', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify(body),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Échec de la création.');
        window.location.href = `dossier.html?id=${json.dossier.id}`;
      } catch (error) {
        showMsg(error.message);
        submitBtn.disabled = false; submitBtn.textContent = 'Créer le dossier';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
