<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes séjours — Espace Client | Les Hortensias</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body class="app-body">

  <div class="app-topbar">
    <div class="app-logo"><span>🌸</span><span>Les Hortensias — Espace Client</span></div>
    <div class="app-user">
      <span id="userLabel"></span>
      <button class="app-logout" id="notifBtn">🔔 Notifications <span id="notifBadge"></span></button>
      <button class="app-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="app-container" style="padding-bottom:0;">
    <div id="notifPanel" class="app-card" style="display:none;"></div>
  </div>
  <div class="app-container" id="appRoot" style="padding-top:0;">
    <div class="app-loading">Chargement de vos séjours…</div>
  </div>

  <script type="module">
    import { getSupabaseClient } from '../lib/supabaseClient.js';
    import { docCompleteness, formatMontant } from '../lib/appConstants.js';
    import { mountDossierPanel, buildTodoList, stayDates, stayCategory } from './lib/dossierPanel.js';

    const root = document.getElementById('appRoot');
    let supabase;
    const mountedPanels = {}; // dossierId -> { reload }

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function init() {
      try { supabase = await getSupabaseClient(); }
      catch (e) { root.innerHTML = `<div class="app-msg app-msg-error">${esc(e.message)}</div>`; return; }

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (!profile) { root.innerHTML = `<div class="app-msg app-msg-error">Profil introuvable. Contactez l'administrateur.</div>`; return; }
      if (profile.role === 'admin') { window.location.href = '../admin/dashboard.html'; return; }
      document.getElementById('userLabel').textContent = profile.full_name || profile.email || '';

      if (profile.email !== session.user.email) {
        await supabase.from('profiles').update({ email: session.user.email }).eq('id', session.user.id);
      }

      supabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') window.location.href = 'index.html'; });

      await loadSejours(session);
      await loadNotifications();
    }

    let notifications = [];

    async function loadNotifications() {
      const { data } = await supabase.from('notifications').select('*').eq('audience', 'client').order('created_at', { ascending: false }).limit(50);
      notifications = data || [];
      const unread = notifications.filter(n => !n.lu).length;
      document.getElementById('notifBadge').textContent = unread ? `(${unread})` : '';
    }

    function renderNotifPanel() {
      const panel = document.getElementById('notifPanel');
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="margin:0;">Notifications</h2>
          <button class="app-btn app-btn-sm app-btn-outline" id="markAllReadBtn">Tout marquer comme lu</button>
        </div>
        <ul class="app-todo-list">
          ${notifications.map(n => `
            <li style="cursor:pointer;${n.lu ? 'opacity:.55;' : ''}" data-notif-id="${n.id}" data-notif-dossier="${n.dossier_id || ''}">
              <span class="app-todo-dot" style="background:${n.lu ? 'var(--beige-fonce)' : 'var(--or)'};"></span>
              ${esc(n.message)} <span style="color:var(--texte-clair);font-size:.78rem;">— ${new Date(n.created_at).toLocaleString('fr-FR')}</span>
            </li>`).join('') || '<li>Aucune notification.</li>'}
        </ul>
      `;
      document.getElementById('markAllReadBtn').addEventListener('click', async () => {
        await supabase.from('notifications').update({ lu: true }).eq('audience', 'client').eq('lu', false);
        await loadNotifications();
        renderNotifPanel();
      });
      panel.querySelectorAll('[data-notif-id]').forEach(li => {
        li.addEventListener('click', async () => {
          await supabase.from('notifications').update({ lu: true }).eq('id', li.dataset.notifId);
          await loadNotifications();
          if (li.dataset.notifDossier) {
            document.getElementById('notifPanel').style.display = 'none';
            openStay(li.dataset.notifDossier);
          } else {
            renderNotifPanel();
          }
        });
      });
    }

    document.getElementById('notifBtn').addEventListener('click', () => {
      const panel = document.getElementById('notifPanel');
      const showing = panel.style.display !== 'none';
      if (showing) { panel.style.display = 'none'; return; }
      renderNotifPanel();
      panel.style.display = 'block';
    });

    function stayTitle(d) {
      if (d.client_type === 'group') return `Groupe — ${d.structure_nom || d.etablissement}`;
      const programmeLabel = d.programme === 'volcan' ? 'Classe Volcan' : d.programme === 'nature' ? 'Classe Nature' : 'Séjour';
      return `${programmeLabel} — ${d.etablissement}`;
    }

    function dateRangeLabel(d) {
      const { debut, fin, confirmed } = stayDates(d);
      if (!debut) return 'Dates à préciser';
      const fmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
      const range = fin && fin !== debut ? `${fmt(debut)} → ${fmt(fin)}` : fmt(debut);
      return confirmed ? range : `${range} (proposé)`;
    }

    function stayCard(d, documentsByDossier) {
      const docs = documentsByDossier[d.id] || [];
      const todo = buildTodoList(d, docs);
      const completeness = docCompleteness(docs);
      const reste = d.montant_facture != null ? Number(d.montant_facture) - Number(d.montant_paye || 0) : null;
      const actionRequired = todo.length > 0;

      return `
      <details class="stay-accordion" data-dossier-id="${d.id}">
        <summary class="stay-summary">
          <div class="stay-summary-main">
            <div class="stay-summary-title">${esc(stayTitle(d))}</div>
            <div class="stay-summary-meta">${dateRangeLabel(d)} · Dossier ${esc(d.numero)}</div>
            <div class="stay-summary-indicators">
              ${completeness.total ? `<span class="app-badge app-badge-gray">Documents : ${completeness.valides}/${completeness.total}</span>` : ''}
              ${reste != null ? `<span class="app-badge app-badge-gray">Reste à payer : ${formatMontant(reste)}</span>` : ''}
            </div>
          </div>
          <span class="app-badge app-badge-${actionRequired ? 'red' : 'green'} stay-status-badge">
            ${actionRequired ? `🔴 ${todo.length} action${todo.length > 1 ? 's' : ''} nécessaire${todo.length > 1 ? 's' : ''}` : '🟢 Dossier à jour'}
          </span>
          <span class="stay-chevron">▾</span>
        </summary>
        <div class="stay-body" data-dossier-body="${d.id}">
          <div class="app-loading">Chargement…</div>
        </div>
      </details>`;
    }

    function bindAccordions(session) {
      root.querySelectorAll('.stay-accordion').forEach((details) => {
        details.addEventListener('toggle', () => {
          if (!details.open) return;
          const dossierId = details.dataset.dossierId;
          if (mountedPanels[dossierId]) return; // déjà monté, ne recharge pas au re-repli/ouverture
          const body = details.querySelector(`[data-dossier-body="${dossierId}"]`);
          mountedPanels[dossierId] = mountDossierPanel(body, { supabase, session, dossierId });
        }, { once: false });
      });
    }

    function openStay(dossierId) {
      const details = root.querySelector(`.stay-accordion[data-dossier-id="${dossierId}"]`);
      if (!details) return;
      details.open = true;
      details.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function loadSejours(session) {
      const { data: acces, error } = await supabase
        .from('dossier_acces')
        .select('*, dossiers(*)')
        .neq('statut', 'desactive')
        .order('created_at', { ascending: false });

      if (error) { root.innerHTML = `<div class="app-msg app-msg-error">${esc(error.message)}</div>`; return; }

      const dossiers = (acces || []).map(a => a.dossiers).filter(Boolean);

      if (!dossiers.length) {
        root.innerHTML = `<div class="app-msg app-msg-info">Aucun séjour n'est encore associé à votre compte. Contactez Fun Loisirs Réunion.</div>`;
        return;
      }

      const { data: docs } = await supabase.from('documents').select('*').in('dossier_id', dossiers.map(d => d.id));
      const documentsByDossier = {};
      (docs || []).forEach(doc => { (documentsByDossier[doc.dossier_id] = documentsByDossier[doc.dossier_id] || []).push(doc); });

      const buckets = { a_venir: [], en_cours: [], passes: [] };
      dossiers.forEach(d => buckets[stayCategory(d)].push(d));
      buckets.a_venir.sort((a, b) => (stayDates(a).debut || '9999') > (stayDates(b).debut || '9999') ? 1 : -1);
      buckets.en_cours.sort((a, b) => (stayDates(a).debut || '9999') > (stayDates(b).debut || '9999') ? 1 : -1);
      buckets.passes.sort((a, b) => (stayDates(b).debut || '') > (stayDates(a).debut || '') ? 1 : -1);

      root.innerHTML = `
        <h2 style="color:var(--vert-fonce);margin-bottom:16px;">Mes séjours</h2>

        ${buckets.en_cours.length ? `
        <div class="app-card">
          <h3 style="margin-top:0;">En cours (${buckets.en_cours.length})</h3>
          ${buckets.en_cours.map(d => stayCard(d, documentsByDossier)).join('')}
        </div>` : ''}

        <div class="app-card">
          <h3 style="margin-top:0;">À venir (${buckets.a_venir.length})</h3>
          ${buckets.a_venir.map(d => stayCard(d, documentsByDossier)).join('') || '<p style="color:var(--texte-clair);font-size:.9rem;">Aucun séjour à venir pour le moment.</p>'}
        </div>

        ${buckets.passes.length ? `
        <details class="app-card past-stays-toggle">
          <summary class="past-stays-summary">Afficher les séjours passés (${buckets.passes.length}) <span class="stay-chevron">▾</span></summary>
          <div style="margin-top:16px;">
            ${buckets.passes.map(d => stayCard(d, documentsByDossier)).join('')}
          </div>
        </details>` : ''}
      `;

      bindAccordions(session);
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
