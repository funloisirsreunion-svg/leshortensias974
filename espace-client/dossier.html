<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon dossier — Espace Client | Les Hortensias</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body class="app-body">

  <div class="app-topbar">
    <div class="app-logo"><span>🌸</span><span>Les Hortensias — Espace Client</span></div>
    <div class="app-user">
      <a href="dashboard.html" class="app-btn app-btn-sm app-btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);">← Mes séjours</a>
      <span id="userLabel"></span>
      <button class="app-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="app-container">
    <div class="app-card" id="headerCard" style="display:none;">
      <h2 id="dossierTitle"></h2>
      <p style="color:var(--texte-clair);" id="dossierSubtitle"></p>
    </div>
    <div id="panelRoot">
      <div class="app-loading">Chargement de votre dossier…</div>
    </div>
  </div>

  <script type="module">
    import { getSupabaseClient } from '../lib/supabaseClient.js';
    import { mountDossierPanel } from './dossierPanel.js';
    import { sejourLabel } from '../lib/appConstants.js';

    const dossierId = new URLSearchParams(window.location.search).get('id');
    const panelRoot = document.getElementById('panelRoot');
    let supabase;

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function init() {
      if (!dossierId) { panelRoot.innerHTML = `<div class="app-msg app-msg-error">Séjour non spécifié. <a href="dashboard.html">Retour à mes séjours</a>.</div>`; return; }
      try {
        supabase = await getSupabaseClient();
      } catch (e) {
        panelRoot.innerHTML = `<div class="app-msg app-msg-error">${esc(e.message)}</div>`;
        return;
      }

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      supabase.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') window.location.href = 'index.html';
      });

      const { data: profile, error: pErr } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (pErr || !profile) { panelRoot.innerHTML = `<div class="app-msg app-msg-error">Profil introuvable. Contactez l'administrateur.</div>`; return; }
      if (profile.role === 'admin') { window.location.href = '../admin/dashboard.html'; return; }
      document.getElementById('userLabel').textContent = profile.full_name || profile.email || '';

      if (profile.email !== session.user.email) {
        await supabase.from('profiles').update({ email: session.user.email }).eq('id', session.user.id);
      }

      await mountDossierPanel({
        container: panelRoot,
        supabase,
        dossierId,
        onChange: (dossier) => {
          document.getElementById('headerCard').style.display = 'block';
          document.getElementById('dossierTitle').textContent = sejourLabel(dossier);
          document.getElementById('dossierSubtitle').textContent = `Dossier n° ${dossier.numero}`;
        },
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
